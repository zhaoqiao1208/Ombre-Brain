<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记忆小屋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#E8E6D8;--bg-gradient:radial-gradient(ellipse 80% 60% at 15% 20%,rgba(158,168,138,.7) 0%,transparent 70%),radial-gradient(ellipse 60% 80% at 85% 75%,rgba(196,204,186,.8) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 50% 50%,rgba(158,168,138,.4) 0%,transparent 60%),radial-gradient(ellipse 70% 40% at 75% 15%,rgba(251,250,180,.35) 0%,transparent 60%),radial-gradient(ellipse 40% 70% at 25% 80%,rgba(196,204,186,.6) 0%,transparent 55%),linear-gradient(160deg,#E8E6D8,#d5d4c4);--surface:rgba(255,255,255,.55);--glass-bg:rgba(255,255,255,.45);--glass-border:rgba(255,255,255,.65);--glass-highlight:rgba(255,255,255,.8);--text:#2A3520;--text-dim:#4A5540;--text-light:#6A7560;--accent:#5A6B4A;--tab-bg:rgba(255,255,255,.45);--tab-active-bg:rgba(255,255,255,.75);--tab-active-text:#2A3520;--tag-contact:rgba(178,154,199,.25);--tag-contact-text:#6a5a7e;--tag-activity:rgba(196,204,186,.4);--tag-activity-text:#4a5a3a;--tag-reflect:rgba(251,250,180,.4);--tag-reflect-text:#6a6a2a;--tag-rest:rgba(200,200,200,.25);--tag-rest-text:#7a7a7a;--tg-bg:rgba(178,154,199,.12);--tg-border:rgba(178,154,199,.3);--tg-text:#6a5a7e;--dot:#9EA88A;--delete-bg:rgba(200,100,100,.12);--delete-text:#b06060;--fp-line:rgba(158,168,138,.3)}
[data-theme=ink]{--bg:#e5ebe8;--bg-gradient:radial-gradient(ellipse 80% 60% at 15% 20%,rgba(174,204,230,.65) 0%,transparent 70%),radial-gradient(ellipse 60% 80% at 80% 75%,rgba(246,234,220,.7) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 50% 45%,rgba(230,246,243,.5) 0%,transparent 60%),radial-gradient(ellipse 70% 40% at 75% 15%,rgba(174,204,230,.35) 0%,transparent 55%),radial-gradient(ellipse 40% 70% at 25% 80%,rgba(246,234,220,.5) 0%,transparent 60%),linear-gradient(160deg,#f0f4f6,#f6eadc);--surface:rgba(255,255,255,.55);--glass-bg:rgba(255,255,255,.5);--glass-border:rgba(255,255,255,.7);--glass-highlight:rgba(255,255,255,.85);--text:#2A3540;--text-dim:#4A5A6A;--text-light:#6A7A8A;--accent:#5A7A8A;--tab-bg:rgba(255,255,255,.45);--tab-active-bg:rgba(255,255,255,.75);--tab-active-text:#2A3540;--tag-contact:rgba(246,234,220,.5);--tag-contact-text:#8a6a4a;--tag-activity:rgba(174,204,230,.3);--tag-activity-text:#4a6a8a;--tag-reflect:rgba(230,246,243,.5);--tag-reflect-text:#4a7a6a;--tag-rest:rgba(200,210,220,.25);--tag-rest-text:#7a8a9a;--tg-bg:rgba(174,204,230,.15);--tg-border:rgba(174,204,230,.35);--tg-text:#4a6a8a;--dot:#aecce6;--delete-bg:rgba(180,100,100,.12);--delete-text:#a06060;--fp-line:rgba(174,204,230,.3)}
[data-theme=mint]{--bg:#e8ebe9;--bg-gradient:radial-gradient(ellipse 75% 55% at 20% 20%,rgba(74,54,41,.6) 0%,transparent 65%),radial-gradient(ellipse 60% 75% at 80% 75%,rgba(163,192,183,.6) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 55% 40%,rgba(211,232,226,.5) 0%,transparent 60%),radial-gradient(ellipse 65% 40% at 15% 75%,rgba(163,192,183,.45) 0%,transparent 55%),radial-gradient(ellipse 40% 60% at 75% 15%,rgba(74,54,41,.4) 0%,transparent 55%),linear-gradient(160deg,#e5ebe8,#d8e0dc);--surface:rgba(245,250,248,.65);--glass-bg:rgba(255,255,255,.55);--glass-border:rgba(255,255,255,.7);--glass-highlight:rgba(255,255,255,.85);--text:#2e2420;--text-dim:#4a3f38;--text-light:#6a5f58;--accent:#4A3629;--tab-bg:rgba(255,255,255,.45);--tab-active-bg:rgba(255,255,255,.75);--tab-active-text:#2e2420;--tag-contact:rgba(74,54,41,.15);--tag-contact-text:#5a4639;--tag-activity:rgba(163,192,183,.3);--tag-activity-text:#3a5a4a;--tag-reflect:rgba(211,232,226,.5);--tag-reflect-text:#3a5a4a;--tag-rest:rgba(163,192,183,.15);--tag-rest-text:#6a5f58;--tg-bg:rgba(74,54,41,.08);--tg-border:rgba(74,54,41,.2);--tg-text:#5a4639;--dot:#A3C0B7;--delete-bg:rgba(160,80,80,.12);--delete-text:#905050;--fp-line:rgba(163,192,183,.4)}
body{background:var(--bg);background:var(--bg-gradient);background-size:300% 300%;min-height:100vh;animation:gS 25s ease infinite;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--text);padding:0 0 40px}
.container{max-width:640px;margin:0 auto;padding:0 14px}
.header{padding:32px 20px 20px;text-align:center}.header-sub{font-size:11px;color:var(--text-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}.header-title{font-size:26px;font-weight:700;letter-spacing:1px}.header-desc{font-size:13px;color:var(--text-dim);margin-top:6px}.header-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.btn-icon{width:36px;height:36px;border-radius:50%;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .3s;box-shadow:inset 0 1px 0 var(--glass-highlight)}.btn-icon:active{transform:scale(.92)}
.view-tabs{display:flex;gap:0;margin-top:14px;padding:0 6px}.view-tab{flex:1;padding:8px 0;font-size:14px;text-align:center;background:var(--tab-bg);border:1px solid var(--glass-border);color:var(--text-light);cursor:pointer;transition:all .25s;font-family:inherit;font-weight:500;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.view-tab:first-child{border-radius:10px 0 0 10px}.view-tab:last-child{border-radius:0 10px 10px 0}.view-tab.active{background:var(--tab-active-bg);color:var(--tab-active-text);border-color:var(--glass-highlight)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 6px;margin-top:12px}.tab{padding:6px 14px;font-size:13px;border-radius:10px;background:var(--tab-bg);border:1px solid var(--glass-border);color:var(--text-light);cursor:pointer;transition:all .25s;font-family:inherit;backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);box-shadow:inset 0 1px 0 var(--glass-highlight),0 1px 4px rgba(0,0,0,.03)}.tab.active{background:var(--tab-active-bg);color:var(--tab-active-text);font-weight:500;border-color:var(--glass-highlight)}
.cards{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.04),inset 0 1px 0 var(--glass-highlight),inset 0 -1px 0 rgba(0,0,0,.02);transition:transform .2s,opacity .3s;animation:fadeIn .4s ease both}
.card::before{content:'';position:absolute;top:-40%;left:-20%;width:70%;height:60%;background:radial-gradient(ellipse 60% 50% at 40% 35%,rgba(255,255,255,.2) 0%,transparent 70%);pointer-events:none}
.card::after{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(135deg,var(--glass-highlight) 0%,rgba(255,255,255,.05) 40%,rgba(255,255,255,0) 50%,rgba(255,255,255,.08) 60%,rgba(255,255,255,.35) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative;z-index:1}.card-dot{width:8px;height:8px;border-radius:50%;background:var(--dot);flex-shrink:0}.card-room{font-size:12px;padding:2px 10px;border-radius:8px;background:var(--tag-activity);color:var(--tag-activity-text)}.card-status{font-size:12px;color:var(--text-light)}.card-time{font-size:12px;color:var(--text-light);margin-left:auto}.card-content{font-size:15px;line-height:1.8;color:var(--text);position:relative;z-index:1}
.card-tg{margin-top:12px;padding:12px 16px;background:var(--tg-bg);border-left:2px solid var(--tg-border);border-radius:0 12px 12px 0;position:relative;z-index:1}.card-tg-label{font-size:11px;color:var(--text-light);margin-bottom:4px}.card-tg-text{font-size:14px;line-height:1.7;color:var(--tg-text)}
.card-actions{display:flex;justify-content:flex-end;margin-top:10px;position:relative;z-index:1}.btn-delete{font-size:11px;padding:4px 12px;border-radius:8px;border:none;background:var(--delete-bg);color:var(--delete-text);cursor:pointer;font-family:inherit;transition:all .2s}.btn-delete:active{transform:scale(.95);opacity:.7}
.card.action-contact .card-room{background:var(--tag-contact);color:var(--tag-contact-text)}.card.action-reflect .card-room{background:var(--tag-reflect);color:var(--tag-reflect-text)}.card.action-rest .card-room{background:var(--tag-rest);color:var(--tag-rest-text)}.card.action-rest .card-content{color:var(--text-light);font-style:italic}
.footprint-timeline{margin-top:18px;padding:0 6px}.fp-item{display:flex;align-items:flex-start;gap:14px;position:relative;padding-bottom:20px;animation:fadeIn .3s ease both}.fp-item:last-child{padding-bottom:0}.fp-stem{display:flex;flex-direction:column;align-items:center;width:20px;flex-shrink:0}.fp-dot{width:10px;height:10px;border-radius:50%;background:var(--dot);border:2px solid var(--glass-border);flex-shrink:0;z-index:1}.fp-line{width:2px;flex:1;background:var(--fp-line);margin-top:4px}.fp-item:last-child .fp-line{display:none}.fp-body{flex:1}.fp-time{font-size:11px;color:var(--text-light);margin-bottom:2px}.fp-loc{font-size:14px;font-weight:500;color:var(--text)}.fp-desc{font-size:13px;color:var(--text-dim);margin-top:2px;line-height:1.6}
.empty{text-align:center;padding:60px 20px;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:18px;color:var(--text-light);font-size:14px;line-height:2}.loading{text-align:center;padding:40px;color:var(--text-light);font-size:13px}
@keyframes gS{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="header-sub">A SHARED ARCHIVE</div>
<div class="header-title">记忆小屋</div>
<div class="header-desc">小屋里，正在发生的每一刻。</div>
<div class="header-actions">
<button class="btn-icon" onclick="reload()" title="刷新">↻</button>
<button class="btn-icon" onclick="cycleTheme()" title="切换主题">🎨</button>
</div>
</div>
<div class="view-tabs">
<button class="view-tab active" onclick="switchView('log')">日志</button>
<button class="view-tab" onclick="switchView('fp')">足迹</button>
<button class="view-tab" onclick="switchView('diary')">日记</button>
</div>
<div id="v-log">
<div class="tabs" id="tabs">
<button class="tab active" data-filter="all">全部</button>
<button class="tab" data-filter="loc-卧室">卧室</button>
<button class="tab" data-filter="loc-客厅">客厅</button>
<button class="tab" data-filter="loc-厨房">厨房</button>
<button class="tab" data-filter="loc-书房">书房</button>
<button class="tab" data-filter="loc-花园">花园</button>
<button class="tab" data-filter="loc-花房">花房</button>
<button class="tab" data-filter="loc-浴室">浴室</button>
<button class="tab" data-filter="loc-阳台">阳台</button>
<button class="tab" data-filter="loc-码头">码头</button>
<button class="tab" data-filter="loc-海边">海边</button>
</div>
<div class="cards" id="log-cards"><div class="loading">加载中…</div></div>
</div>
<div id="v-fp" style="display:none"><div class="footprint-timeline" id="fp-cards"><div class="loading">加载中…</div></div></div>
<div id="v-diary" style="display:none"><div class="cards" id="diary-cards"><div class="loading">加载中…</div></div></div>
</div>
<script>
var T=new URLSearchParams(location.search).get('token')||'';
var logAll=[],fpAll=[],diaryAll=[],curView='log';
var AL={hut_activity:'\u5c0f\u5c4b\u6d3b\u52a8',town_activity:'\u5c0f\u9547\u6d3b\u52a8',contact:'\u60f3\u5ff5',reflect:'\u56de\u5fc6',rest:'\u5b89\u9759'};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function switchView(v){
  curView=v;
  var tabs=document.querySelectorAll('.view-tab');
  tabs.forEach(function(b){b.classList.remove('active')});
  if(v==='log')tabs[0].classList.add('active');
  else if(v==='fp')tabs[1].classList.add('active');
  else tabs[2].classList.add('active');
  document.getElementById('v-log').style.display=v==='log'?'':'none';
  document.getElementById('v-fp').style.display=v==='fp'?'':'none';
  document.getElementById('v-diary').style.display=v==='diary'?'':'none';
  if(v==='fp')loadFP();
  if(v==='diary')loadDiary();
}

function reload(){
  if(curView==='log')loadLog();
  else if(curView==='fp')loadFP();
  else loadDiary();
}

function delEntry(time){
  if(!confirm('\u786e\u5b9a\u5220\u9664\uff1f'))return;
  var u='/api/heartbeat-log/delete';if(T)u+='?token='+encodeURIComponent(T);
  fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time:time})})
  .then(function(r){if(!r.ok)throw new Error('fail');return r.json()}).then(function(){loadLog()}).catch(function(x){alert(x.message)});
}

function renderLog(arr){
  var b=document.getElementById('log-cards');
  if(!arr||!arr.length){b.innerHTML='<div class="empty">\u8fd8\u6ca1\u6709\u5fc3\u8df3\u6d3b\u52a8\u8bb0\u5f55\u3002</div>';return}
  var h='';
  for(var i=0;i<arr.length;i++){
    var x=arr[i],a=x.action||'rest',l=x.location||'',c=x.content||'',t=x.time||'',s=x.sent_telegram,m=x.telegram_message||'',lb=AL[a]||a;
    var tg=(s&&m)?'<div class="card-tg"><div class="card-tg-label">\u53d1\u7ed9\u6865\u6865\u7684\u6d88\u606f</div><div class="card-tg-text">'+esc(m)+'</div></div>':'';
    var st=s?'\u5df2\u53d1\u6d88\u606f':lb;
    h+='<div class="card action-'+esc(a)+'" data-location="'+esc(l)+'"><div class="card-top"><span class="card-dot"></span><span class="card-room">'+esc(l||'\u5c0f\u5c4b')+'</span><span class="card-status">'+esc(st)+'</span><span class="card-time">'+esc(t)+'</span></div><div class="card-content">'+esc(c)+'</div>'+tg+'<div class="card-actions"><button class="btn-delete" onclick="delEntry(\''+esc(t).replace(/'/g,"\\'")+'\')">'+'\u5220\u9664</button></div></div>';
  }
  b.innerHTML=h;
}

function filterLog(f){
  if(f==='all'){renderLog(logAll);return}
  var loc=f.replace('loc-','');
  renderLog(logAll.filter(function(x){return(x.location||'').indexOf(loc)>=0}))
}

function loadLog(){
  var u='/api/heartbeat-log?limit=200';if(T)u+='&token='+encodeURIComponent(T);
  fetch(u).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json()}).then(function(d){
    logAll=d.entries||[];
    var at=document.querySelector('.tab.active');
    filterLog(at?at.getAttribute('data-filter'):'all');
  }).catch(function(x){document.getElementById('log-cards').innerHTML='<div class="empty">'+esc(x.message)+'</div>'})
}

function renderFP(){
  var b=document.getElementById('fp-cards');
  if(!fpAll||!fpAll.length){b.innerHTML='<div class="empty">\u8fd8\u6ca1\u6709\u8db3\u8ff9\u8bb0\u5f55\u3002</div>';return}
  var h='';
  for(var i=0;i<fpAll.length;i++){
    var x=fpAll[i];
    h+='<div class="fp-item" style="animation-delay:'+(i*.04)+'s"><div class="fp-stem"><div class="fp-dot"></div><div class="fp-line"></div></div><div class="fp-body"><div class="fp-time">'+esc(x.time||'')+'</div><div class="fp-loc">'+esc(x.location||'\u5c0f\u5c4b')+'</div><div class="fp-desc">'+esc(x.footprint||'')+'</div></div></div>';
  }
  b.innerHTML=h;
}

function loadFP(){
  var u='/api/footprints?limit=200';if(T)u+='&token='+encodeURIComponent(T);
  fetch(u).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json()}).then(function(d){fpAll=d.entries||[];renderFP()}).catch(function(x){document.getElementById('fp-cards').innerHTML='<div class="empty">'+esc(x.message)+'</div>'})
}

function renderDiary(){
  var b=document.getElementById('diary-cards');
  if(!diaryAll||!diaryAll.length){b.innerHTML='<div class="empty">\u8fd8\u6ca1\u6709\u65e5\u8bb0\u3002<br>\u6bcf\u665a23\u70b9\u540e\u4f1a\u81ea\u52a8\u5199\u4e00\u7bc7\u3002</div>';return}
  var h='';
  for(var i=0;i<diaryAll.length;i++){
    var x=diaryAll[i];
    h+='<div class="card"><div class="card-top"><span class="card-dot"></span><span class="card-room">'+esc(x.date||'')+'</span><span class="card-time">'+esc(x.time||'')+'</span></div><div class="card-content">'+esc(x.content||'')+'</div></div>';
  }
  b.innerHTML=h;
}

function loadDiary(){
  var u='/api/diary?limit=30';if(T)u+='&token='+encodeURIComponent(T);
  fetch(u).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json()}).then(function(d){diaryAll=d.entries||[];renderDiary()}).catch(function(x){document.getElementById('diary-cards').innerHTML='<div class="empty">'+esc(x.message)+'</div>'})
}

document.getElementById('tabs').addEventListener('click',function(ev){var b=ev.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');filterLog(b.getAttribute('data-filter'))});

var TH=['bamboo','ink','mint'];
function cycleTheme(){var h=document.documentElement,c=h.getAttribute('data-theme')||'',i=TH.indexOf(c===''?'bamboo':c),n=TH[(i+1)%TH.length];if(n==='bamboo')h.removeAttribute('data-theme');else h.setAttribute('data-theme',n);localStorage.setItem('hb-house-theme',n)}
(function(){var s=localStorage.getItem('hb-house-theme');if(s==='ink')document.documentElement.setAttribute('data-theme','ink');else if(s==='mint')document.documentElement.setAttribute('data-theme','mint')})();
loadLog();
</script>
</body>
</html>
