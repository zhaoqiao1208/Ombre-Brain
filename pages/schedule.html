<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>排班表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --bg: #E8E6D8;
  --bg-gradient: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(158,168,138,0.7) 0%, transparent 70%), radial-gradient(ellipse 60% 80% at 85% 75%, rgba(196,204,186,0.8) 0%, transparent 65%), radial-gradient(ellipse 50% 50% at 50% 50%, rgba(158,168,138,0.4) 0%, transparent 60%), radial-gradient(ellipse 70% 40% at 75% 15%, rgba(251,250,180,0.35) 0%, transparent 60%), radial-gradient(ellipse 40% 70% at 25% 80%, rgba(196,204,186,0.6) 0%, transparent 55%), linear-gradient(160deg, #E8E6D8 0%, #d5d4c4 100%);
  --surface: rgba(255,255,255,0.55);
  --glass-bg: rgba(255,255,255,0.45);
  --glass-border: rgba(255,255,255,0.65);
  --glass-highlight: rgba(255,255,255,0.8);
  --text: #2A3520;
  --text-dim: #4A5540;
  --text-light: #6A7560;
  --accent: #5A6B4A;
  --tab-bg: rgba(255,255,255,0.45);
  --tab-active-bg: rgba(255,255,255,0.75);
  --tab-active-text: #2A3520;
  --dot: #9EA88A;
  --tag-early: rgba(251,220,140,0.4);
  --tag-early-text: #6a5a1a;
  --tag-late: rgba(178,154,199,0.3);
  --tag-late-text: #6a5a7e;
  --tag-off: rgba(196,204,186,0.4);
  --tag-off-text: #4a5a3a;
  --delete-bg: rgba(200,100,100,0.12);
  --delete-text: #b06060;
  --save-bg: rgba(90,107,74,0.18);
  --save-text: #3a4a2a;
}
[data-theme="ink"] {
  --bg: #e5ebe8;
  --bg-gradient: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(174,204,230,0.65) 0%, transparent 70%), radial-gradient(ellipse 60% 80% at 80% 75%, rgba(246,234,220,0.7) 0%, transparent 65%), radial-gradient(ellipse 50% 50% at 50% 45%, rgba(230,246,243,0.5) 0%, transparent 60%), radial-gradient(ellipse 70% 40% at 75% 15%, rgba(174,204,230,0.35) 0%, transparent 55%), radial-gradient(ellipse 40% 70% at 25% 80%, rgba(246,234,220,0.5) 0%, transparent 60%), linear-gradient(160deg, #f0f4f6 0%, #f6eadc 100%);
  --surface: rgba(255,255,255,0.55);
  --glass-bg: rgba(255,255,255,0.5);
  --glass-border: rgba(255,255,255,0.7);
  --glass-highlight: rgba(255,255,255,0.85);
  --text: #2A3540;
  --text-dim: #4A5A6A;
  --text-light: #6A7A8A;
  --accent: #5A7A8A;
  --tab-bg: rgba(255,255,255,0.45);
  --tab-active-bg: rgba(255,255,255,0.75);
  --tab-active-text: #2A3540;
  --dot: #aecce6;
  --tag-early: rgba(246,234,220,0.5);
  --tag-early-text: #8a6a4a;
  --tag-late: rgba(174,204,230,0.3);
  --tag-late-text: #4a6a8a;
  --tag-off: rgba(230,246,243,0.5);
  --tag-off-text: #4a7a6a;
  --delete-bg: rgba(180,100,100,0.12);
  --delete-text: #a06060;
  --save-bg: rgba(90,130,140,0.15);
  --save-text: #3a5a6a;
}
[data-theme="mint"] {
  --bg: #e8ebe9;
  --bg-gradient: radial-gradient(ellipse 75% 55% at 20% 20%, rgba(74,54,41,0.6) 0%, transparent 65%), radial-gradient(ellipse 60% 75% at 80% 75%, rgba(163,192,183,0.6) 0%, transparent 65%), radial-gradient(ellipse 50% 50% at 55% 40%, rgba(211,232,226,0.5) 0%, transparent 60%), radial-gradient(ellipse 65% 40% at 15% 75%, rgba(163,192,183,0.45) 0%, transparent 55%), radial-gradient(ellipse 40% 60% at 75% 15%, rgba(74,54,41,0.4) 0%, transparent 55%), linear-gradient(160deg, #e5ebe8 0%, #d8e0dc 100%);
  --surface: rgba(245,250,248,0.65);
  --glass-bg: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.7);
  --glass-highlight: rgba(255,255,255,0.85);
  --text: #2e2420;
  --text-dim: #4a3f38;
  --text-light: #6a5f58;
  --accent: #4A3629;
  --tab-bg: rgba(255,255,255,0.45);
  --tab-active-bg: rgba(255,255,255,0.75);
  --tab-active-text: #2e2420;
  --dot: #A3C0B7;
  --tag-early: rgba(211,232,226,0.5);
  --tag-early-text: #3a5a4a;
  --tag-late: rgba(74,54,41,0.15);
  --tag-late-text: #5a4639;
  --tag-off: rgba(163,192,183,0.3);
  --tag-off-text: #3a5a4a;
  --delete-bg: rgba(160,80,80,0.12);
  --delete-text: #905050;
  --save-bg: rgba(74,54,41,0.12);
  --save-text: #4a3629;
}
body { background: var(--bg); background: var(--bg-gradient); background-size: 300% 300%; min-height: 100vh; animation: gradientShift 25s ease infinite; font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; color: var(--text); padding: 0 0 40px; }
.container { max-width: 640px; margin: 0 auto; padding: 0 14px; }
.header { padding: 32px 20px 20px; text-align: center; }
.header-sub { font-size: 11px; color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.header-title { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
.header-desc { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
.header-actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
.btn-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; transition: all 0.3s; box-shadow: inset 0 1px 0 var(--glass-highlight); }
.btn-icon:active { transform: scale(0.92); }
.cards { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid var(--glass-border); border-radius: 18px; padding: 16px 20px; position: relative; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.04), inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0,0,0,0.02); transition: transform 0.2s; animation: fadeIn 0.4s ease both; }
.card::before { content: ''; position: absolute; top: -40%; left: -20%; width: 70%; height: 60%; background: radial-gradient(ellipse 60% 50% at 40% 35%, rgba(255,255,255,0.2) 0%, transparent 70%); pointer-events: none; }
.card::after { content: ''; position: absolute; inset: 0; border-radius: 18px; padding: 1px; background: linear-gradient(135deg, var(--glass-highlight) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.0) 50%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0.35) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.day-row { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.day-date { flex: 1; }
.day-date-main { font-size: 16px; font-weight: 600; }
.day-date-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.day-tag { font-size: 13px; padding: 4px 14px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
.day-tag.early { background: var(--tag-early); color: var(--tag-early-text); }
.day-tag.late { background: var(--tag-late); color: var(--tag-late-text); }
.day-tag.off { background: var(--tag-off); color: var(--tag-off-text); }
.day-tag.custom { background: var(--tag-off); color: var(--text-dim); }
.day-time { font-size: 12px; color: var(--text-light); min-width: 90px; text-align: right; }
.day-edit { width: 28px; height: 28px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; transition: all 0.2s; flex-shrink: 0; }
.day-edit:active { transform: scale(0.9); }
.today-marker { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 3px 0 0 3px; }
.card.is-today { border-color: var(--accent); }
.section-title { font-size: 13px; color: var(--text-light); letter-spacing: 1px; margin: 20px 6px 8px; }
.special-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; position: relative; z-index: 1; }
.special-date { font-size: 14px; font-weight: 500; min-width: 80px; }
.special-type { font-size: 12px; padding: 2px 10px; border-radius: 8px; }
.special-note { font-size: 13px; color: var(--text-dim); flex: 1; }
.special-del { width: 24px; height: 24px; border-radius: 50%; background: var(--delete-bg); color: var(--delete-text); border: none; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.add-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.add-bar input, .add-bar select { font-size: 13px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(8px); color: var(--text); font-family: inherit; }
.add-bar input:focus, .add-bar select:focus { outline: none; border-color: var(--accent); }
.add-bar input[type="date"] { width: 130px; }
.add-bar input[type="text"] { flex: 1; min-width: 80px; }
.btn-add, .btn-save { font-size: 13px; padding: 6px 16px; border-radius: 10px; border: 1px solid var(--glass-border); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-add { background: var(--glass-bg); color: var(--text); }
.btn-save { background: var(--save-bg); color: var(--save-text); font-weight: 500; margin-top: 14px; width: 100%; padding: 10px; }
.btn-add:active, .btn-save:active { transform: scale(0.97); opacity: 0.8; }
.edit-modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); backdrop-filter: blur(6px); }
.edit-modal.show { display: flex; }
.edit-panel { background: var(--bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; width: 280px; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
.edit-panel h3 { font-size: 16px; margin-bottom: 14px; }
.edit-options { display: flex; flex-direction: column; gap: 8px; }
.edit-opt { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); cursor: pointer; font-size: 14px; font-family: inherit; text-align: left; transition: all 0.2s; }
.edit-opt:active { transform: scale(0.97); }
.edit-opt.active { border-color: var(--accent); background: var(--save-bg); font-weight: 500; }
.edit-cancel { margin-top: 10px; width: 100%; padding: 8px; border-radius: 10px; border: none; background: none; color: var(--text-light); cursor: pointer; font-size: 13px; font-family: inherit; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
.toast.show { opacity: 1; }
.loading { text-align: center; padding: 40px; color: var(--text-light); font-size: 13px; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.1s; }
.card:nth-child(4) { animation-delay: 0.15s; }
.card:nth-child(5) { animation-delay: 0.2s; }
.card:nth-child(6) { animation-delay: 0.25s; }
.card:nth-child(7) { animation-delay: 0.3s; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-sub">WORK SCHEDULE</div>
    <div class="header-title">排班表</div>
    <div class="header-desc">早晚晚循环 · 自动计算</div>
    <div class="header-actions">
      <button class="btn-icon" onclick="loadSchedule()" title="刷新">↻</button>
      <button class="btn-icon" onclick="cycleTheme()" title="切换主题">🎨</button>
    </div>
  </div>
  <div class="cards" id="schedule"><div class="loading">加载中…</div></div>
  <div class="section-title">特殊日期</div>
  <div id="specials"></div>
  <div class="add-bar">
    <input type="date" id="sp-date">
    <select id="sp-type"><option value="early">早班</option><option value="late">晚班</option><option value="off">休息</option><option value="custom">自定义</option></select>
    <input type="text" id="sp-note" placeholder="备注">
    <button class="btn-add" onclick="addSpecial()">添加</button>
  </div>
  <button class="btn-save" onclick="saveOverrides()">保存修改</button>
</div>
<div class="edit-modal" id="editModal">
  <div class="edit-panel">
    <h3 id="editTitle">编辑班次</h3>
    <div class="edit-options">
      <button class="edit-opt" onclick="pickShift('early')">☀️ 早班 06:45–14:30</button>
      <button class="edit-opt" onclick="pickShift('late')">🌙 晚班 14:00–21:30</button>
      <button class="edit-opt" onclick="pickShift('off')">🏖️ 休息</button>
      <button class="edit-opt" onclick="pickShift('reset')">↩️ 恢复默认</button>
    </div>
    <button class="edit-cancel" onclick="closeEdit()">取消</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var TOKEN = new URLSearchParams(location.search).get('token') || '';
var scheduleData = [];
var overrides = {};
var specials = [];
var editingDate = '';
var SHIFT_LABELS = { early: '早班', late: '晚班', off: '休息', custom: '自定义' };
var SHIFT_TIMES = { early: '06:45–14:30', late: '14:00–21:30', off: '', custom: '' };
var WEEKDAYS = ['日','一','二','三','四','五','六'];

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2000);
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderSchedule() {
  var box = document.getElementById('schedule');
  if (!scheduleData.length) { box.innerHTML = '<div class="loading">暂无排班数据</div>'; return; }
  var today = todayStr();
  var h = '';
  for (var i = 0; i < scheduleData.length; i++) {
    var d = scheduleData[i];
    var dateStr = d.date || '';
    var parts = dateStr.split('-');
    var dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    var weekday = WEEKDAYS[dt.getDay()];
    var shiftType = d.shift || 'early';
    if (overrides[dateStr]) shiftType = overrides[dateStr];
    var label = SHIFT_LABELS[shiftType] || shiftType;
    var timeStr = SHIFT_TIMES[shiftType] || '';
    var isToday = dateStr === today;
    var overridden = !!overrides[dateStr];
    h += '<div class="card' + (isToday ? ' is-today' : '') + '">';
    if (isToday) h += '<div class="today-marker"></div>';
    h += '<div class="day-row">';
    h += '<div class="day-date"><div class="day-date-main">' + esc(parts[1]+'.'+parts[2]) + ' 周' + weekday + '</div>';
    if (isToday) h += '<div class="day-date-sub">今天</div>';
    if (overridden) h += '<div class="day-date-sub" style="color:var(--accent)">已修改</div>';
    h += '</div>';
    h += '<span class="day-tag ' + esc(shiftType) + '">' + esc(label) + '</span>';
    if (timeStr) h += '<span class="day-time">' + esc(timeStr) + '</span>';
    h += '<button class="day-edit" onclick="openEdit(\'' + esc(dateStr) + '\')">\u270e</button>';
    h += '</div></div>';
  }
  box.innerHTML = h;
}

function renderSpecials() {
  var box = document.getElementById('specials');
  if (!specials.length) { box.innerHTML = '<div style="font-size:13px;color:var(--text-light);padding:8px 0;">暂无特殊日期</div>'; return; }
  var h = '';
  for (var i = 0; i < specials.length; i++) {
    var s = specials[i];
    var tp = s.type || 'off';
    h += '<div class="card" style="padding:12px 16px"><div class="special-row">';
    h += '<span class="special-date">' + esc(s.date || '') + '</span>';
    h += '<span class="special-type day-tag ' + esc(tp) + '">' + esc(SHIFT_LABELS[tp] || tp) + '</span>';
    h += '<span class="special-note">' + esc(s.note || '') + '</span>';
    h += '<button class="special-del" onclick="removeSpecial(' + i + ')">×</button>';
    h += '</div></div>';
  }
  box.innerHTML = h;
}

function openEdit(dateStr) {
  editingDate = dateStr;
  var parts = dateStr.split('-');
  document.getElementById('editTitle').textContent = parts[1] + '.' + parts[2] + ' 班次';
  document.getElementById('editModal').classList.add('show');
}
function closeEdit() { document.getElementById('editModal').classList.remove('show'); editingDate = ''; }
function pickShift(type) {
  if (!editingDate) return;
  if (type === 'reset') { delete overrides[editingDate]; }
  else { overrides[editingDate] = type; }
  closeEdit();
  renderSchedule();
}

function addSpecial() {
  var date = document.getElementById('sp-date').value;
  var type = document.getElementById('sp-type').value;
  var note = document.getElementById('sp-note').value.trim();
  if (!date) { toast('请选择日期'); return; }
  specials.push({ date: date, type: type, note: note });
  overrides[date] = type;
  document.getElementById('sp-date').value = '';
  document.getElementById('sp-note').value = '';
  renderSpecials();
  renderSchedule();
}

function removeSpecial(idx) {
  var s = specials[idx];
  if (s && overrides[s.date] === s.type) delete overrides[s.date];
  specials.splice(idx, 1);
  renderSpecials();
  renderSchedule();
}

function saveOverrides() {
  var url = '/api/schedule';
  if (TOKEN) url += '?token=' + encodeURIComponent(TOKEN);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ overrides: overrides, specials: specials })
  }).then(function(r) {
    if (!r.ok) throw new Error('save failed: ' + r.status);
    return r.json();
  }).then(function() {
    toast('保存成功');
  }).catch(function(e) {
    toast('保存失败: ' + e.message);
  });
}

function loadSchedule() {
  var url = '/api/schedule?days=7';
  if (TOKEN) url += '&token=' + encodeURIComponent(TOKEN);
  fetch(url).then(function(r) {
    if (!r.ok) throw new Error('API error ' + r.status);
    return r.json();
  }).then(function(data) {
    scheduleData = data.days || [];
    overrides = data.overrides || {};
    specials = data.specials || [];
    renderSchedule();
    renderSpecials();
  }).catch(function(e) {
    document.getElementById('schedule').innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>';
  });
}

var THEMES = ['bamboo', 'ink', 'mint'];
function cycleTheme() {
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme') || '';
  var idx = THEMES.indexOf(cur === '' ? 'bamboo' : cur);
  var next = THEMES[(idx + 1) % THEMES.length];
  if (next === 'bamboo') html.removeAttribute('data-theme');
  else html.setAttribute('data-theme', next);
  localStorage.setItem('schedule-theme', next);
}
(function() {
  var s = localStorage.getItem('schedule-theme');
  if (s === 'ink') document.documentElement.setAttribute('data-theme', 'ink');
  else if (s === 'mint') document.documentElement.setAttribute('data-theme', 'mint');
})();
loadSchedule();
</script>
</body>
</html>
